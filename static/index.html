<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CuSOC — Open Source Contribution Tracker</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>

  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        CuSOC
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard">Dashboard</a>
        <a class="nav-item" data-page="repositories">Repositories</a>
        <a class="nav-item" data-page="activity">Activity</a>
        <a class="nav-item" data-page="goals">Goals</a>
        <a class="nav-item" data-page="leaderboards">Leaderboards</a>
        <a class="nav-item" data-page="mentors">Mentors</a>
        <a class="nav-item" data-page="settings">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a class="nav-item" data-page="profile">Profile</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
      
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-left">
          <span class="breadcrumb" id="global-breadcrumb">CuSOC / <span class="breadcrumb-active">Dashboard</span></span>
        </div>
        <div class="header-center">
          <input type="text" class="global-search" placeholder="Search users, repos, PRs..." />
        </div>
        <div class="header-right">
          <div class="avatar-small">MC</div>
        </div>
      </header>

      <!-- Pages -->
      
      <!-- 1. Dashboard -->
      <section id="page-dashboard" class="page-view active">
        <h1 class="page-title">Dashboard</h1>
        <div id="dashboard-content">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- 2. Repositories -->
      <section id="page-repositories" class="page-view">
        <h1 class="page-title">Repositories</h1>
        <div id="repositories-content"></div>
      </section>

      <!-- 3. Activity -->
      <section id="page-activity" class="page-view">
        <h1 class="page-title">Activity Feed</h1>
        <div id="activity-content"></div>
      </section>

      <!-- 4. Goals -->
      <section id="page-goals" class="page-view">
        <h1 class="page-title">Goals</h1>
        <div id="goals-content"></div>
      </section>

      <!-- 5. Leaderboards -->
      <section id="page-leaderboards" class="page-view">
        <h1 class="page-title">Leaderboards</h1>
        <div id="leaderboards-content"></div>
      </section>

      <!-- 6. Mentors -->
      <section id="page-mentors" class="page-view">
        <h1 class="page-title">Mentors</h1>
        <div id="mentors-content"></div>
      </section>

      <!-- 7. Settings -->
      <section id="page-settings" class="page-view">
        <h1 class="page-title">Settings</h1>
        <div id="settings-content"></div>
      </section>

      <!-- 8. Profile -->
      <section id="page-profile" class="page-view">
        <h1 class="page-title">Profile</h1>
        <div id="profile-content"></div>
      </section>

    </main>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/components/cards.js"></script>
  <script src="/js/components/table.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/leaderboard.js"></script>
  <script src="/js/pages/profile.js"></script>
  <script src="/js/pages/activity.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
